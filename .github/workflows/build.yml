name: Build Neon FPS

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Extract Neon FPS source archive
        run: unzip -o NeonFPS_cloud_build_project.zip -d .

      - name: Build for Android 64-bit using the Geode version in mod.json
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: given
          target: Android64
          path: NeonFPS

      - name: Upload .geode build
        uses: actions/upload-artifact@v4
        with:
          name: NeonFPS-Android64
          path: ${{ steps.build.outputs.build-output }}
          if-no-files-found: error
          
